{#
This custom searchbox triggers the ReadTheDocs search instead of a local search
#}
{%- if builder != "singlehtml" %}
<div class="searchbox mb-6 px-1" role="search">
    <div class="input-group">
        <div class="input-group-prepend">
            <div class="input-group-text border-right-0 bg-white py-3 pl-3 pr-2"><span class="fas fa-search"></span>
            </div>
        </div>
        <input class="form-control py-3 pr-3 pl-1 h-100 border-left-0"
               type="search"
               name="q"
               placeholder="Search documentation"
               aria-label="Search documentation"/>
    </div>
</div>
<script>
    document.querySelector("[role=search] input").addEventListener("focusin", () => {
        const event = new CustomEvent("readthedocs-search-show");
        document.dispatchEvent(event);
    });
</script>
{%- endif %}
